<!DOCTYPE html>
<html lang="en">
  {% include header.html %}
  {% include scripts.html %}
  <body id="override">

    {% include nav.html %}

    <main class="content">
      <div class="row">
        <!--Post list-->
        <div class="col-xs-12 col-md-3">
          <ul>
            {% for post in site.posts %}
            <li>
              <a href="{{ post.url }}">{{ post.date | date: "%-m/%-d/%Y" }} - {{ post.title }}</a>
            </li>
            {% endfor %}
          </ul>
        </div>
        <div class="col-xs-12 col-md-9">
          <div id="post-content">
            <h1>{{ page.title }}</h1>
            <span class="date">{{ page.date | date: "%-m/%-d/%Y" }}</span>
            <p>
            {{ content }}
          </div>
        </div>
      </div>
    </main>

    {% include footer.html %}
  </body>
</html>
